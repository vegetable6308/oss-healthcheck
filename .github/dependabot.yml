version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint currently supports TypeScript < 6.1. Keep receiving
    # compatible minor/patch updates and revisit this when its peer range moves.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
